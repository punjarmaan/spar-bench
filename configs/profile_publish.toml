# Canonical published scope only: main (competence, k1) plus diamond (reliability, k4). Excludes
# the unpublished lite dev-smoke split so paid/frontier runs don't pay for episodes that never get
# published. Temperatures are pinned per stage, same values as profile.toml.

[competence]   # main pass^1 plus the per-axis breakdown
temperature = 0.0
top_p = 1.0
max_tokens = 2048
seed = 7

[reliability]  # diamond pass^4 — modest temp so pass^4 discriminates
temperature = 0.7
top_p = 1.0
max_tokens = 2048

[[plan]]
split = "main"
k = 1
stage = "competence"
published = true

[[plan]]
split = "diamond"
k = 4
stage = "reliability"
published = true
