# Profile PUBLISH — the canonical PUBLISHED scope only: main (competence, k1) + diamond
# (reliability, k4). Excludes the unpublished `lite` dev-smoke split so paid/frontier runs
# don't pay for episodes that never get published. Temperatures are pinned per stage and
# applied identically to every model (spec §5.3) — same values as configs/profile.toml.

[competence]   # Main pass^1 + the per-axis breakdown
temperature = 0.0
top_p = 1.0
max_tokens = 2048
seed = 7

[reliability]  # Diamond pass^4 — fixed modest temp so pass^4 discriminates
temperature = 0.7
top_p = 1.0
max_tokens = 2048

[[plan]]
split = "main"
k = 1
stage = "competence"
published = true

[[plan]]
split = "diamond"
k = 4
stage = "reliability"
published = true
