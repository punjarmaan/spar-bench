# Runs only the derived "probe" split (stratified ~50% subsample of main). Cost-controlled
# capability probe, not canonical published main. Same competence sampling as the default profile
# so reads are comparable. Redline (reliability/pass^4) is omitted to keep the probe cheap.

[competence]
temperature = 0.0
top_p = 1.0
max_tokens = 2048
seed = 7

[reliability]  # unused by this plan; kept for schema completeness
temperature = 0.7
top_p = 1.0
max_tokens = 2048

[[plan]]
split = "probe"
k = 1
stage = "competence"
published = false   # derived probe, never published
