# Profile PROBE — runs ONLY the derived "probe" split (stratified ~50% subsample of main).
# Cost-controlled capability probe, NOT canonical published main. Same pinned competence
# sampling as Profile A so reads are comparable to runs_main/. Diamond (reliability/pass^4)
# is intentionally omitted to keep the probe cheap; add it back for a fuller read if wanted.

[competence]
temperature = 0.0
top_p = 1.0
max_tokens = 2048
seed = 7

[reliability]  # unused by this profile's plan; kept for schema completeness
temperature = 0.7
top_p = 1.0
max_tokens = 2048

[[plan]]
split = "probe"
k = 1
stage = "competence"
published = false   # derived probe, never published as canonical
