# Spar cross-model evaluation roster — model IDENTITY ONLY (no sampling knobs; those live in
# profile.toml so no model can be tuned). OpenRouter is the default route; set OPENROUTER_API_KEY.
# Adding/switching a model = editing this file. Roster is NOT a frozen surface (the freeze contract
# explicitly allows adding/swapping contestants — only dataset/grader/profile/responder are frozen).
# Prices are per-Mtok, from the live OpenRouter catalog on 2026-06-02 (cost-reporting fallback).
#
# Revised 2026-06-02: roster upgraded to each lab's current-generation flagship + a curated
# open-weight set. `supports_response_format=false` uniformly (prompt-format path; the validated-clean
# route — json_object caused gemini's 30% wrong-envelope before the lenient parser). `reasoning=true`
# is set per each model's OpenRouter `supported_parameters`; reasoning runs at effort=high (agent.py).
#
# ===========================================================================================
# FRONTIER TIER — each lab's current flagship (replaces the prior -4 / v3.2 / 235b pins).
# ===========================================================================================

[[model]]
id            = "claude-opus-4.8"
route         = "openrouter/anthropic/claude-opus-4.8"
class         = "frontier"
supports_response_format = false
price_in_per_mtok  = 5.0
price_out_per_mtok = 25.0
version_pin   = "anthropic/claude-opus-4.8"
reasoning     = true

