# Spar cross-model evaluation roster — model IDENTITY ONLY (no sampling knobs; those live in
# profile.toml so no model can be tuned). OpenRouter is the default route; set OPENROUTER_API_KEY.
# Adding/switching a model = editing this file. Prices are optional (cost reporting fallback).

[[model]]
id            = "claude-opus-4"
route         = "openrouter/anthropic/claude-opus-4"
class         = "frontier"
supports_response_format = true
price_in_per_mtok  = 15.0
price_out_per_mtok = 75.0
version_pin   = "anthropic/claude-opus-4@2026-05"

[[model]]
id            = "gpt-5"
route         = "openrouter/openai/gpt-5"
class         = "frontier"
supports_response_format = true
price_in_per_mtok  = 10.0
price_out_per_mtok = 30.0
version_pin   = "openai/gpt-5@2026-05"

[[model]]
id            = "llama-3.3-70b"
route         = "openrouter/meta-llama/llama-3.3-70b-instruct"
class         = "open"
supports_response_format = false
price_in_per_mtok  = 0.12
price_out_per_mtok = 0.30
version_pin   = "meta-llama/llama-3.3-70b-instruct@2026-05"

[[model]]
# gemini-2.0-flash-001 was delisted on OpenRouter (404); repointed to the live successor.
# OpenRouter has NO @date pin syntax — the id itself is the pin (gemini-2.5-flash tracks Google's
# current 2.5-flash; use a dated variant like gemini-2.5-flash-lite-preview-09-2025 for strict repro).
id            = "gemini-2.5-flash"
route         = "openrouter/google/gemini-2.5-flash"
class         = "open"
supports_response_format = true
price_in_per_mtok  = 0.30
price_out_per_mtok = 2.50
version_pin   = "google/gemini-2.5-flash"

[[model]]
id            = "claude-sonnet-4"
route         = "openrouter/anthropic/claude-sonnet-4"
class         = "frontier"
supports_response_format = false
price_in_per_mtok  = 3.0
price_out_per_mtok = 15.0
version_pin   = "anthropic/claude-sonnet-4@2026-05"

[[model]]
id            = "deepseek-v3.2"
route         = "openrouter/deepseek/deepseek-v3.2"
class         = "frontier"
supports_response_format = false
price_in_per_mtok  = 0.25
price_out_per_mtok = 0.38
version_pin   = "deepseek/deepseek-v3.2@2026-05"

[[model]]
id            = "qwen3-235b-a22b"
route         = "openrouter/qwen/qwen3-235b-a22b-2507"
class         = "frontier"
supports_response_format = false
price_in_per_mtok  = 0.07
price_out_per_mtok = 0.10
version_pin   = "qwen/qwen3-235b-a22b-2507@2026-05"

# --- Free OpenRouter models (:free) for the cheap-first probe rollout. $0 spend; heavily
# rate-limited (low RPM + daily caps) so a full probe run may be slow / hit 429 retries.
# prompt-format path (supports_response_format=false) to minimize malformed_action on capable models.
[[model]]
id            = "gpt-oss-120b-free"
route         = "openrouter/openai/gpt-oss-120b:free"
