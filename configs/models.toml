# Spar cross-model evaluation roster — model identity only; sampling knobs live in profile.toml
# so no model can be tuned. OpenRouter is the default route; set OPENROUTER_API_KEY. The roster is
# not a frozen surface: adding or swapping contestants is allowed.
# Prices are per-Mtok from the OpenRouter catalog on 2026-06-02, used as a cost-reporting fallback.
# supports_response_format=false uniformly: json_object caused gemini's wrong-envelope outputs, so
# everything uses the prompt-format path. reasoning runs at effort=high.
#
# FRONTIER TIER — each lab's current flagship.

[[model]]
id            = "claude-opus-4.8"
route         = "openrouter/anthropic/claude-opus-4.8"
class         = "frontier"
supports_response_format = false
price_in_per_mtok  = 5.0
price_out_per_mtok = 25.0
version_pin   = "anthropic/claude-opus-4.8"
reasoning     = true

