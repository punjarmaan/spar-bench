# Default Spar evaluation profile. Temperature is pinned per stage and applied to every model.

[competence]   # main pass^1 plus per-axis breakdown
temperature = 0.0
top_p = 1.0
max_tokens = 2048
seed = 7

[reliability]  # diamond pass^4 — modest temp so pass^4 discriminates
temperature = 0.7
top_p = 1.0
max_tokens = 2048

# lite is dev/smoke, never published.
[[plan]]
split = "main"
k = 1
stage = "competence"
published = true

[[plan]]
split = "diamond"
k = 4
stage = "reliability"
published = true

[[plan]]
split = "lite"
k = 1
stage = "competence"
published = false
