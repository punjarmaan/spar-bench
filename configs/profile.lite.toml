# Validation profile — lite only, both stages, never published. Validates the live eval pipeline
# end-to-end on one cheap model before widening. Temperature is a property of the stage, not the
# model: competence = pass^1 @ temp 0; reliability = pass^4 @ temp 0.7 (pass^k at temp 0 would make
# all k trajectories identical and measure nothing).

[competence]
temperature = 0.0
top_p = 1.0
max_tokens = 2048
seed = 7

[reliability]
temperature = 0.7
top_p = 1.0
max_tokens = 2048
seed = 7

# lite only, both stages, dev/validation.
[[plan]]
split = "lite"
k = 1
stage = "competence"
published = false

[[plan]]
split = "lite"
k = 4
stage = "reliability"
published = false
