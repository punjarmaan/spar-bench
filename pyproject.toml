[project]
name = "spar"
version = "0.1.0"
description = "Spar — a benchmark for autonomous payment execution by LLM agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.4", "mypy>=1.10"]
llm = ["litellm>=1.40", "python-dotenv>=1.0"]

[project.scripts]
spar = "spar.harness.run_eval:app"
spar-submit = "spar.leaderboard.submit:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "frontier: costly tests that call frontier models (excluded by `-m \"not frontier\"`; run periodically/manually only)",
]
# An unregistered marker is a hard error so a typo'd frontier mark can't slip past the
# `-m "not frontier"` selector.
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

# litellm is an optional dependency imported lazily and ships no type stubs, so skip
# type-checking it under --strict.
[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true
follow_imports = "skip"
