[project]
name = "spar"
version = "0.1.0"
description = "Spar — a benchmark for autonomous payment execution by LLM agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
spar = "spar.harness.run_eval:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
